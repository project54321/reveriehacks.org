name: Deploy to reveriehacks.org

# Build the site and upload it to GoDaddy over FTP on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a deploy manually from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ReverieHacks/package-lock.json

      - name: Install dependencies
        working-directory: ReverieHacks
        run: npm ci

      - name: Build
        working-directory: ReverieHacks
        run: npm run build

      - name: Deploy to GoDaddy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # The built site to upload (note the trailing slash).
          local-dir: ReverieHacks/dist/
          # The web root on GoDaddy. Adjust if your files live elsewhere
          # (e.g. ./ if FTP already lands you inside public_html).
          server-dir: ./public_html/
