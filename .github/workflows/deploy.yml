name: Deploy to GitHub Pages

# Build the Vite app and publish it to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ReverieHacks/package-lock.json

      - name: Install dependencies
        working-directory: ReverieHacks
        run: npm ci

      - name: Build
        working-directory: ReverieHacks
        run: npm run build

      # GitHub Pages has no server rewrites, so a direct hit on /team etc.
      # would 404. Serving a copy of index.html as 404.html lets the SPA
      # boot and route client-side for any deep link.
      - name: Add SPA fallback
        run: cp ReverieHacks/dist/index.html ReverieHacks/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ReverieHacks/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
